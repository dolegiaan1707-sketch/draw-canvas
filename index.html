<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { display: grid; place-items: center; }
  #wrap {
    position: relative;
    width: min(100vw, 100vh);
    width: min(100vw, 100dvh);
    aspect-ratio: 1 / 1;
    background: #fff;
    outline: 1px solid #e5e5e5;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  button {
    position: absolute; right: 12px; bottom: 12px;
    font: 14px/1 system-ui, sans-serif;
    padding: 10px 14px; border: 1px solid #111; border-radius: 999px;
    background: #fff; color: #111; cursor: pointer;
  }
  button:active { background: #111; color: #fff; }
  #saved { position: absolute; inset: 0; z-index: 1; background: #fff; }
  #saved[hidden] { display: none; }
  #saved img { width: 100%; height: 100%; display: block; }
  #saved p {
    position: absolute; top: 12px; left: 0; right: 0; margin: 0; text-align: center;
    font: 14px/1.4 system-ui, sans-serif; color: #111;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="save" style="right:100px;">Save</button>
  <button id="clear">Erase</button>
  <div id="saved" hidden>
    <img alt="Your drawing">
    <p>Right-click or long-press the image to save it</p>
    <button id="close">Close</button>
  </div>
</div>
<script src="background.js"></script>
<script>
  const wrap = document.getElementById('wrap');
  wrap.style.background = `#fff url(${BG}) center / cover no-repeat`;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let strokes = [];   // points stored as 0-1 so drawings survive resizing
  let current = null;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = wrap.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    render();
  }

  function render() {
    const s = canvas.width;
    ctx.clearRect(0, 0, s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Math.max(2, s * 0.006);
    for (const stroke of strokes) {
      ctx.beginPath();
      stroke.forEach((p, i) => {
        const x = p.x * s, y = p.y * s;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (stroke.length === 1) ctx.lineTo(stroke[0].x * s + 0.1, stroke[0].y * s);
      ctx.stroke();
    }
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    current = [pos(e)];
    strokes.push(current);
    render();
  });
  canvas.addEventListener('pointermove', e => {
    if (!current) return;
    current.push(pos(e));
    render();
  });
  const end = () => { current = null; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  document.getElementById('clear').addEventListener('click', () => { strokes = []; render(); });

  window.addEventListener('resize', resize);
  resize();
  document.getElementById('save').addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    const o = out.getContext('2d');
    o.fillStyle = '#fff';
    o.fillRect(0, 0, out.width, out.height);

    const img = new Image();
    img.onload = () => {
      // same "cover" crop as the CSS background
      const s = Math.max(out.width / img.width, out.height / img.height);
      const w = img.width * s, h = img.height * s;
      o.drawImage(img, (out.width - w) / 2, (out.height - h) / 2, w, h);
      o.drawImage(canvas, 0, 0);
      const url = out.toDataURL('image/png');
      // embeds like Notion sandbox the iframe without allow-downloads, so scripted downloads are silently blocked;
      // show the image instead and let the browser's own "Save image" do it
      if (window.self !== window.top) {
        saved.querySelector('img').src = url;
        saved.hidden = false;
        return;
      }
      const a = document.createElement('a');
      a.href = url;
      a.download = 'atilla.png';
      a.click();
    };
    img.src = BG;
  });
  const saved = document.getElementById('saved');
  document.getElementById('close').addEventListener('click', () => { saved.hidden = true; });
</script>
</body>
</html>
